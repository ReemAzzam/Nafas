name: nafas-mobile-fixed

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: nafas_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      APP_KEY: "${APP_KEY}"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8010
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: nafas_db
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
      LOG_CHANNEL: stderr
    volumes:
      - local-data:/data
      - local-media:/app/storage/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
  local-data:
  local-media:
